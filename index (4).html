<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#d9822b">
<title>Hundloggen</title>
<style>
  :root { --bg:#fbf6ee; --bg2:#fdebd0; --card:#fffdf9; --ink:#33261a; --muted:#8a7766; --accent:#d9822b; --accent-d:#b8661a; --line:#eadfce; --bad:#c0392b; --shadow:0 2px 10px rgba(90,60,20,.08);
    --ate-bg:#fde9c8; --ate-fg:#a35a0b; --walked-bg:#d9efdc; --walked-fg:#2f7a3e; --pooped-bg:#eadbcf; --pooped-fg:#7a4a2a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1d1812; --bg2:#2b2013; --card:#272019; --ink:#f3e9dc; --muted:#a89885; --line:#3a3126; --shadow:0 2px 10px rgba(0,0,0,.35);
      --ate-bg:#4a3513; --ate-fg:#f3c77b; --walked-bg:#1f3a25; --walked-fg:#8fd19b; --pooped-bg:#3d2c20; --pooped-fg:#d9b59a; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif; background:linear-gradient(180deg,var(--bg2) 0,var(--bg) 260px) no-repeat, var(--bg); color:var(--ink); min-height:100vh; }
  main { max-width: 560px; margin: 0 auto; padding: calc(14px + env(safe-area-inset-top)) 14px 120px; }
  .svg, [data-ic] { display:inline-flex; line-height:0; }
  svg { width:1em; height:1em; }
  .t-ate { --t-bg:var(--ate-bg); --t-fg:var(--ate-fg); }
  .t-walked { --t-bg:var(--walked-bg); --t-fg:var(--walked-fg); }
  .t-pooped { --t-bg:var(--pooped-bg); --t-fg:var(--pooped-fg); }

  .hero { display:flex; align-items:center; gap:14px; margin:4px 2px 16px; }
  .dog { width:64px; height:64px; border-radius:50%; background:var(--ate-bg); font-size:50px; align-items:center; justify-content:center; box-shadow:var(--shadow); flex:none; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-size:1.7rem; font-weight:700; margin:0; line-height:1.1; letter-spacing:-.01em; }
  .sub { margin:3px 0 0; color:var(--muted); font-size:.9rem; }

  .card { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:16px; margin-bottom:14px; box-shadow:var(--shadow); }

  .nav { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .nav button { width:48px; height:48px; border-radius:50%; border:1px solid var(--line); background:var(--card); color:var(--ink); font-size:1.3rem; align-items:center; justify-content:center; display:inline-flex; box-shadow:var(--shadow); cursor:pointer; transition:transform .12s; }
  .nav button:active:not(:disabled) { transform:scale(.92); }
  .nav button:disabled { opacity:.3; cursor:default; }
  .nav .date { text-align:center; flex:1; }
  .nav .date b { display:block; font-family:Georgia,serif; font-size:1.3rem; text-transform:capitalize; }
  .nav .date span { font-size:.82rem; color:var(--muted); }
  .linkbtn { background:var(--card); border:1px solid var(--line); border-radius:999px; color:var(--accent-d); font:inherit; font-size:.85rem; font-weight:600; padding:6px 14px; cursor:pointer; }

  .summary { display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; }
  .sum { background:var(--t-bg); color:var(--t-fg); border-radius:16px; padding:12px 6px; text-align:center; font-size:.78rem; animation:rise .45s both; }
  .sum:nth-child(2) { animation-delay:.07s; } .sum:nth-child(3) { animation-delay:.14s; }
  .sum .ic { width:38px; height:38px; margin:0 auto 6px; border-radius:50%; background:rgba(255,255,255,.65); font-size:22px; align-items:center; justify-content:center; display:flex; }
  @media (prefers-color-scheme: dark) { .sum .ic { background:rgba(0,0,0,.25); } }
  .sum b { display:block; font-size:.9rem; }
  .sum .ago { display:block; margin-top:2px; font-weight:600; }
  .sum .by { display:block; opacity:.8; }

  .entry { position:relative; display:flex; gap:12px; padding:0 0 18px; animation:rise .4s both; animation-delay:calc(var(--i,0) * 50ms); }
  .entry:last-child { padding-bottom:0; }
  .entry:not(:last-child)::before { content:""; position:absolute; left:19px; top:44px; bottom:4px; width:2px; background:var(--line); border-radius:2px; }
  .av { width:40px; height:40px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:1rem; }
  .body { flex:1; min-width:0; }
  .head { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .who { font-weight:700; }
  .time { color:var(--muted); font-size:.85rem; font-variant-numeric:tabular-nums; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .chip { background:var(--t-bg); color:var(--t-fg); border-radius:999px; padding:4px 11px 4px 8px; font-size:.85rem; font-weight:600; display:inline-flex; align-items:center; gap:5px; }
  .chip svg { font-size:1.05rem; }
  .note { margin-top:8px; padding:9px 12px; background:var(--bg); border-radius:4px 14px 14px 14px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .del { background:none; border:0; color:var(--muted); font:inherit; font-size:.78rem; padding:6px 0 0; text-decoration:underline; cursor:pointer; }
  .empty { color:var(--muted); text-align:center; padding:22px 0 14px; }
  .empty .big { display:block; font-size:44px; opacity:.35; margin-bottom:6px; }

  .fab { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(16px + env(safe-area-inset-bottom)); width:calc(100% - 28px); max-width:532px; display:flex; align-items:center; justify-content:center; gap:8px;
         padding:17px; border:0; border-radius:20px; background:linear-gradient(180deg,#e8923a,var(--accent-d)); color:#fff; font:inherit; font-size:1.1rem; font-weight:700; box-shadow:0 8px 22px rgba(184,102,26,.45); cursor:pointer; transition:transform .12s; }
  .fab:active { transform:translateX(-50%) scale(.97); }
  .fab svg { font-size:1.3rem; stroke-width:2.6; }

  .overlay { position:fixed; inset:0; background:rgba(30,18,6,.5); backdrop-filter:blur(3px); display:none; align-items:flex-end; justify-content:center; z-index:10; }
  .overlay.open { display:flex; animation:fade .2s both; }
  .sheet { background:var(--bg); width:100%; max-width:560px; border-radius:26px 26px 0 0; padding:10px 18px calc(18px + env(safe-area-inset-bottom)); max-height:92vh; overflow:auto; animation:slide .28s cubic-bezier(.2,.8,.2,1) both; }
  .sheet::before { content:""; display:block; width:42px; height:5px; border-radius:3px; background:var(--line); margin:0 auto 12px; }
  .sheet h2 { margin:0 0 6px; font-family:Georgia,serif; font-size:1.35rem; }
  label { display:block; font-size:.85rem; font-weight:600; color:var(--muted); margin:14px 0 5px; }
  input, textarea { width:100%; font:inherit; font-size:16px; padding:13px; border:1.5px solid var(--line); border-radius:14px; background:var(--card); color:var(--ink); }
  input:focus, textarea:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(217,130,43,.2); }
  textarea { min-height:90px; resize:vertical; }
  .toggles { display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; }
  .tog { border:2px solid var(--line); background:var(--card); color:var(--ink); border-radius:18px; padding:12px 2px; font:inherit; font-size:.88rem; cursor:pointer; transition:transform .12s, border-color .12s; }
  .tog .ti { width:44px; height:44px; margin:0 auto 5px; border-radius:50%; background:var(--t-bg); color:var(--t-fg); font-size:26px; align-items:center; justify-content:center; display:flex; transition:background .15s, color .15s; }
  .tog.on { border-color:var(--t-fg); background:var(--t-bg); font-weight:700; animation:pop .25s; }
  .tog.on .ti { background:var(--t-fg); color:var(--card); }
  .hint { font-size:.78rem; color:var(--muted); margin-top:8px; }
  .row { display:flex; gap:10px; margin-top:16px; }
  .row button { flex:1; padding:15px; border-radius:16px; font:inherit; font-weight:700; cursor:pointer; }
  .cancel { border:1.5px solid var(--line); background:var(--card); color:var(--ink); }
  .save { border:0; background:linear-gradient(180deg,#e8923a,var(--accent-d)); color:#fff; }
  .save:disabled { opacity:.5; }
  .err { color:var(--bad); font-size:.9rem; min-height:1.2em; margin-top:10px; }

  @keyframes rise { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
  @keyframes fade { from { opacity:0; } to { opacity:1; } }
  @keyframes slide { from { transform:translateY(100%); } to { transform:none; } }
  @keyframes pop { 50% { transform:scale(1.06); } }
  @media (prefers-reduced-motion: reduce) { *, *::before { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<main>
  <header class="hero">
    <div class="dog" data-ic="dog"></div>
    <div><h1 id="title">Hundloggen</h1><p class="sub">Familjens dagbok</p></div>
  </header>

  <div class="nav">
    <button id="prev" aria-label="Föregående dag" data-ic="left"></button>
    <div class="date"><b id="dayLabel"></b><span id="dayDate"></span></div>
    <button id="next" aria-label="Nästa dag" data-ic="right"></button>
  </div>
  <div style="text-align:center;margin:-2px 0 12px"><button class="linkbtn" id="today" hidden>Tillbaka till idag</button></div>

  <div class="card" id="summaryCard">
    <div class="summary" id="summary"></div>
  </div>

  <div id="feed"></div>
</main>

<button class="fab" id="add"><span data-ic="plus"></span>Lägg till</button>

<div class="overlay" id="overlay">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle">Lägg till</h2>

    <label for="name">Ditt namn</label>
    <input id="name" maxlength="30" autocomplete="given-name" placeholder="Skriv ditt namn">

    <label for="time">Klockan <span id="whenDay"></span></label>
    <input id="time" type="time">

    <label>Vad hände?</label>
    <div class="toggles">
      <button type="button" class="tog t-ate" data-tag="ate"><span class="ti" data-ic="ate"></span>Åt</button>
      <button type="button" class="tog t-walked" data-tag="walked"><span class="ti" data-ic="walked"></span>Rastade</button>
      <button type="button" class="tog t-pooped" data-tag="pooped"><span class="ti" data-ic="pooped"></span>Bajsade</button>
    </div>
    <div class="hint">Rastade = promenad utanför tomten, inte bara ut på gården. Du kan välja flera.</div>

    <label for="note">Kommentar</label>
    <textarea id="note" maxlength="1000" placeholder="T.ex. vad hunden åt, hur långt ni gick, om den mår dåligt…"></textarea>

    <div class="err" id="err"></div>
    <div class="row">
      <button class="cancel" id="cancel">Avbryt</button>
      <button class="save" id="save">Spara</button>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const TZ = 'Europe/Stockholm';
const S = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">';
const ICONS = {
  ate: S + '<path d="M3 11h18c0 4.4-3.8 8-9 8s-9-3.6-9-8z"/><path d="M8 7.5h.01M12 6h.01M16 7.5h.01" stroke-width="2.6"/></svg>',
  walked: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5.8" cy="11" r="1.9"/><circle cx="9.6" cy="6.6" r="1.9"/><circle cx="14.4" cy="6.6" r="1.9"/><circle cx="18.2" cy="11" r="1.9"/><path d="M12 11.5c-2.9 0-5.2 2.7-5.2 4.8 0 1.5 1.2 2.4 2.6 2.4.9 0 1.6-.5 2.6-.5s1.7.5 2.6.5c1.4 0 2.6-.9 2.6-2.4 0-2.1-2.3-4.8-5.2-4.8z"/></svg>',
  pooped: S + '<path d="M12 3.5c1.3.8 1.8 1.8 1.4 2.9 1.8.3 2.9 1.4 2.9 2.8 1.6.4 2.9 1.7 2.9 3.5 0 2.2-2 3.8-4.5 3.8H9.4c-2.6 0-4.6-1.6-4.6-3.8 0-1.8 1.3-3.1 2.9-3.5 0-1.4 1.1-2.5 2.9-2.8-.4-1.1.1-2.1 1.4-2.9z"/><path d="M10 12h.01M14 12h.01" stroke-width="2.4"/></svg>',
  plus: S + '<path d="M12 5v14M5 12h14"/></svg>',
  left: S + '<path d="M15 5l-7 7 7 7"/></svg>',
  right: S + '<path d="M9 5l7 7-7 7"/></svg>',
  dog: '<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M10 14c-4 1-6 8-5 14 .5 3 3 4 5 2 2-2 3-8 3-13z" fill="#8a4b14"/><path d="M38 14c4 1 6 8 5 14-.5 3-3 4-5 2-2-2-3-8-3-13z" fill="#8a4b14"/><path d="M24 8c-8 0-13 5-13 13 0 9 5 17 13 17s13-8 13-17c0-8-5-13-13-13z" fill="#e8a24c"/><ellipse cx="24" cy="31" rx="7.5" ry="6" fill="#fff3e3"/><circle cx="18" cy="21" r="2.2" fill="#2b1a0a"/><circle cx="30" cy="21" r="2.2" fill="#2b1a0a"/><path d="M21 27h6l-3 3.6z" fill="#2b1a0a"/><path d="M24 30.5v2.5M20.5 34c1.2 1 2.4 1.2 3.5.2 1.1 1 2.3.8 3.5-.2" fill="none" stroke="#2b1a0a" stroke-width="1.4" stroke-linecap="round"/></svg>'
};
document.querySelectorAll('[data-ic]').forEach((n) => { n.innerHTML = ICONS[n.dataset.ic]; });
const TAGS = { ate: { label: 'Åt' }, walked: { label: 'Rastade' }, pooped: { label: 'Bajsade' } };
const AVATARS = [['#fde1c4', '#9a4f0c'], ['#d9efdc', '#2a6b37'], ['#dbe6fb', '#2f4f9e'], ['#f5dcec', '#9a2f6b'], ['#e9e0f8', '#5b3aa6'], ['#fbeec2', '#7d5d06']];

const keyFmt = new Intl.DateTimeFormat('sv-SE', { timeZone: TZ }); // ger YYYY-MM-DD
const timeFmt = new Intl.DateTimeFormat('sv-SE', { hour: '2-digit', minute: '2-digit', timeZone: TZ });
const longFmt = new Intl.DateTimeFormat('sv-SE', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' });

const todayKey = () => keyFmt.format(new Date());
function shiftKey(key, days) {
  const d = new Date(key + 'T12:00:00Z');
  d.setUTCDate(d.getUTCDate() + days);
  return d.toISOString().slice(0, 10);
}
let current = todayKey();
let selected = new Set();

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function icon(key, cls) {
  const s = el('span', cls || 'svg');
  s.innerHTML = ICONS[key];
  return s;
}
function avatar(name) {
  let h = 0;
  for (const c of name.toLowerCase()) h = (h * 31 + c.codePointAt(0)) >>> 0;
  const [bg, fg] = AVATARS[h % AVATARS.length];
  const a = el('div', 'av', (name.trim()[0] || '?').toUpperCase());
  a.style.background = bg;
  a.style.color = fg;
  return a;
}
const getName = () => { try { return localStorage.getItem('name') || ''; } catch { return ''; } };
const setName = (n) => { try { localStorage.setItem('name', n); } catch {} };

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json' } });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Något gick fel');
  return data;
}

function ago(d) {
  const mins = Math.round((Date.now() - d.getTime()) / 60000);
  if (mins < 1) return 'nyss';
  if (mins < 60) return `${mins} min sedan`;
  const h = Math.floor(mins / 60);
  if (h < 24) return `${h} h sedan`;
  const days = Math.floor(h / 24);
  return days === 1 ? 'igår' : `${days} dagar sedan`;
}

function renderHeader() {
  const t = todayKey();
  const label = current === t ? 'Idag' : current === shiftKey(t, -1) ? 'Igår' : longFmt.format(new Date(current + 'T12:00:00Z'));
  $('dayLabel').textContent = label;
  $('dayDate').textContent = current === t || current === shiftKey(t, -1) ? longFmt.format(new Date(current + 'T12:00:00Z')) : current;
  $('next').disabled = current >= t;
  $('today').hidden = current === t;
  $('summaryCard').hidden = current !== t;
}

function renderSummary(rows) {
  const box = $('summary');
  box.replaceChildren();
  const by = Object.fromEntries(rows.map((r) => [r.tag, r]));
  for (const [key, t] of Object.entries(TAGS)) {
    const r = by[key];
    const d = el('div', 'sum t-' + key);
    d.append(icon(key, 'ic'), el('b', '', t.label), el('span', 'ago', r ? ago(new Date(r.created_at)) : '–'));
    if (r) d.append(el('span', 'by', r.author));
    box.append(d);
  }
}

function renderFeed(rows) {
  const feed = $('feed');
  feed.replaceChildren();
  const card = el('div', 'card');
  if (!rows.length) {
    const empty = el('div', 'empty');
    empty.append(icon('walked', 'big'), document.createTextNode(current === todayKey() ? 'Inget loggat idag än.' : 'Inget loggat den här dagen.'));
    card.append(empty);
  }
  const me = getName().trim();
  rows.forEach((r, i) => {
    const e = el('div', 'entry');
    e.style.setProperty('--i', Math.min(i, 8));
    const body = el('div', 'body');
    const head = el('div', 'head');
    head.append(el('span', 'who', r.author), el('span', 'time', timeFmt.format(new Date(r.created_at))));
    body.append(head);
    if (r.tags.length) {
      const chips = el('div', 'chips');
      for (const k of r.tags) if (TAGS[k]) {
        const c = el('span', 'chip t-' + k);
        c.append(icon(k), document.createTextNode(TAGS[k].label));
        chips.append(c);
      }
      body.append(chips);
    }
    if (r.note) body.append(el('div', 'note', r.note));
    if (me && r.author === me) {
      const del = el('button', 'del', 'Ta bort');
      del.onclick = async () => {
        if (!confirm('Ta bort inlägget?')) return;
        try { await api(`/api/entries/${r.id}?author=${encodeURIComponent(me)}`, { method: 'DELETE' }); } catch (err) { alert(err.message); }
        load();
      };
      body.append(del);
    }
    e.append(avatar(r.author), body);
    card.append(e);
  });
  feed.append(card);
}

async function load() {
  renderHeader();
  try {
    const wantSummary = current === todayKey();
    const [rows, last] = await Promise.all([api(`/api/day?date=${current}`), wantSummary ? api('/api/last') : Promise.resolve([])]);
    if (wantSummary) renderSummary(last);
    renderFeed(rows);
  } catch (err) {
    $('feed').replaceChildren(el('div', 'card empty', 'Kunde inte hämta loggen. Försök igen om en stund.'));
  }
}

// Formulär
function nowHHMM() {
  const p = new Intl.DateTimeFormat('sv-SE', { hour: '2-digit', minute: '2-digit', hourCycle: 'h23', timeZone: TZ }).formatToParts(new Date());
  const get = (t) => p.find((x) => x.type === t).value;
  return `${get('hour')}:${get('minute')}`;
}
function dayWord(key) {
  const t = todayKey();
  if (key === t) return 'idag';
  if (key === shiftKey(t, -1)) return 'igår';
  return longFmt.format(new Date(key + 'T12:00:00Z'));
}

function openSheet() {
  selected = new Set();
  $('time').value = current === todayKey() ? nowHHMM() : '12:00';
  $('whenDay').textContent = `(${dayWord(current)})`;
  document.querySelectorAll('.tog').forEach((b) => b.classList.remove('on'));
  $('note').value = '';
  $('err').textContent = '';
  $('name').value = getName();
  $('overlay').classList.add('open');
  if (!$('name').value) $('name').focus();
}
function closeSheet() { $('overlay').classList.remove('open'); }

document.querySelectorAll('.tog').forEach((b) => {
  b.onclick = () => {
    const k = b.dataset.tag;
    if (selected.has(k)) selected.delete(k); else selected.add(k);
    b.classList.toggle('on', selected.has(k));
  };
});

$('add').onclick = openSheet;
$('cancel').onclick = closeSheet;
$('overlay').onclick = (e) => { if (e.target === $('overlay')) closeSheet(); };

$('save').onclick = async () => {
  const author = $('name').value.trim();
  const note = $('note').value.trim();
  const time = $('time').value;
  if (!author) { $('err').textContent = 'Skriv ditt namn'; return; }
  if (!time) { $('err').textContent = 'Välj klockslag'; return; }
  if (!selected.size && !note) { $('err').textContent = 'Välj något eller skriv en kommentar'; return; }
  $('save').disabled = true;
  try {
    await api('/api/entries', { method: 'POST', body: JSON.stringify({ author, tags: [...selected], note, date: current, time }) });
    setName(author);
    closeSheet();
    load();
  } catch (err) {
    $('err').textContent = err.message;
  } finally {
    $('save').disabled = false;
  }
};

$('prev').onclick = () => { current = shiftKey(current, -1); load(); };
$('next').onclick = () => { if (current < todayKey()) { current = shiftKey(current, 1); load(); } };
$('today').onclick = () => { current = todayKey(); load(); };

(async function start() {
  try {
    const cfg = await api('/api/config');
    document.title = `${cfg.dogName}s logg`;
    $('title').textContent = `${cfg.dogName}s logg`;
  } catch {}
  load();
  setInterval(() => { if (!document.hidden && !$('overlay').classList.contains('open')) load(); }, 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { if (current !== todayKey() && current > todayKey()) current = todayKey(); load(); } });
})();
</script>
</body>
