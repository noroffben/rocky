<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#d9822b">
<title>Hundloggen</title>
<style>
  :root { --bg:#faf7f2; --card:#fff; --ink:#2b2b2b; --muted:#777; --accent:#d9822b; --line:#e8e1d6; --bad:#c0392b; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width: 560px; margin: 0 auto; padding: 12px 14px 110px; }
  h1 { font-size: 1.3rem; margin: 6px 0 12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:12px; }

  .nav { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .nav button { width:48px; height:48px; border-radius:12px; border:1px solid var(--line); background:#fff; font-size:1.4rem; }
  .nav button:disabled { opacity:.3; }
  .nav .date { text-align:center; flex:1; }
  .nav .date b { display:block; font-size:1.15rem; text-transform: capitalize; }
  .nav .date span { font-size:.8rem; color:var(--muted); }
  .linkbtn { background:none; border:0; color:var(--accent); font-size:.85rem; text-decoration:underline; padding:4px; }

  .summary { display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; text-align:center; }
  .sum { font-size:.8rem; }
  .sum .ic { font-size:1.5rem; display:block; }
  .sum b { display:block; margin-top:2px; }
  .sum span { color:var(--muted); display:block; }

  .entry { padding:10px 0; border-bottom:1px solid var(--line); }
  .entry:first-child { padding-top:0; }
  .entry:last-child { border-bottom:0; padding-bottom:0; }
  .head { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .who { font-weight:600; }
  .time { color:var(--muted); font-size:.85rem; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .chip { background:#fff3e3; border:1px solid #f0d4ae; border-radius:999px; padding:3px 10px; font-size:.85rem; }
  .note { margin-top:6px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .del { background:none; border:0; color:var(--muted); font-size:.8rem; padding:6px 0 0; text-decoration:underline; }
  .empty { color:var(--muted); text-align:center; padding:18px 0; }

  .fab { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(16px + env(safe-area-inset-bottom)); width:calc(100% - 28px); max-width:532px;
         padding:16px; border:0; border-radius:16px; background:var(--accent); color:#fff; font-size:1.1rem; font-weight:700; box-shadow:0 6px 18px rgba(0,0,0,.25); }

  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:flex-end; justify-content:center; z-index:10; }
  .overlay.open { display:flex; }
  .sheet { background:var(--bg); width:100%; max-width:560px; border-radius:20px 20px 0 0; padding:16px 16px calc(16px + env(safe-area-inset-bottom)); max-height:92vh; overflow:auto; }
  .sheet h2 { margin:0 0 12px; font-size:1.15rem; }
  label { display:block; font-size:.85rem; color:var(--muted); margin:10px 0 4px; }
  input, textarea { width:100%; font:inherit; font-size:16px; padding:12px; border:1px solid var(--line); border-radius:10px; background:#fff; }
  textarea { min-height:90px; resize:vertical; }
  .toggles { display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; }
  .tog { border:2px solid var(--line); background:#fff; border-radius:12px; padding:12px 2px; font:inherit; font-size:.85rem; }
  .tog .i { display:block; font-size:1.8rem; margin-bottom:2px; }
  .tog.on { border-color:var(--accent); background:#fff3e3; font-weight:600; }
  .hint { font-size:.75rem; color:var(--muted); margin-top:4px; }
  .row { display:flex; gap:8px; margin-top:14px; }
  .row button { flex:1; padding:14px; border-radius:12px; font:inherit; font-weight:600; }
  .cancel { border:1px solid var(--line); background:#fff; }
  .save { border:0; background:var(--accent); color:#fff; }
  .save:disabled { opacity:.5; }
  .err { color:var(--bad); font-size:.9rem; min-height:1.2em; margin-top:8px; }
</style>
</head>
<body>
<main>
  <h1 id="title">🐕 Hundloggen</h1>

  <div class="nav">
    <button id="prev" aria-label="Föregående dag">‹</button>
    <div class="date"><b id="dayLabel"></b><span id="dayDate"></span></div>
    <button id="next" aria-label="Nästa dag">›</button>
  </div>
  <div style="text-align:center;margin:-6px 0 10px"><button class="linkbtn" id="today" hidden>Tillbaka till idag</button></div>

  <div class="card" id="summaryCard">
    <div class="summary" id="summary"></div>
  </div>

  <div id="feed"></div>
</main>

<button class="fab" id="add">＋ Lägg till</button>

<div class="overlay" id="overlay">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle">Lägg till</h2>

    <label for="name">Ditt namn</label>
    <input id="name" maxlength="30" autocomplete="given-name" placeholder="Skriv ditt namn">

    <label for="time">Klockan <span id="whenDay"></span></label>
    <input id="time" type="time">

    <label>Vad hände?</label>
    <div class="toggles">
      <button type="button" class="tog" data-tag="ate"><span class="i">🍖</span>Åt</button>
      <button type="button" class="tog" data-tag="walked"><span class="i">🚶</span>Rastade</button>
      <button type="button" class="tog" data-tag="pooped"><span class="i">💩</span>Bajsade</button>
    </div>
    <div class="hint">Rastade = promenad utanför tomten, inte bara ut på gården. Du kan välja flera.</div>

    <label for="note">Kommentar</label>
    <textarea id="note" maxlength="1000" placeholder="T.ex. vad hunden åt, hur långt ni gick, om den mår dåligt…"></textarea>

    <div class="err" id="err"></div>
    <div class="row">
      <button class="cancel" id="cancel">Avbryt</button>
      <button class="save" id="save">Spara</button>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const TZ = 'Europe/Stockholm';
const TAGS = { ate: { icon: '🍖', label: 'Åt' }, walked: { icon: '🚶', label: 'Rastade' }, pooped: { icon: '💩', label: 'Bajsade' } };

const keyFmt = new Intl.DateTimeFormat('sv-SE', { timeZone: TZ }); // ger YYYY-MM-DD
const timeFmt = new Intl.DateTimeFormat('sv-SE', { hour: '2-digit', minute: '2-digit', timeZone: TZ });
const longFmt = new Intl.DateTimeFormat('sv-SE', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' });

const todayKey = () => keyFmt.format(new Date());
function shiftKey(key, days) {
  const d = new Date(key + 'T12:00:00Z');
  d.setUTCDate(d.getUTCDate() + days);
  return d.toISOString().slice(0, 10);
}
let current = todayKey();
let selected = new Set();

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
const getName = () => { try { return localStorage.getItem('name') || ''; } catch { return ''; } };
const setName = (n) => { try { localStorage.setItem('name', n); } catch {} };

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json' } });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Något gick fel');
  return data;
}

function ago(d) {
  const mins = Math.round((Date.now() - d.getTime()) / 60000);
  if (mins < 1) return 'nyss';
  if (mins < 60) return `${mins} min sedan`;
  const h = Math.floor(mins / 60);
  if (h < 24) return `${h} h sedan`;
  const days = Math.floor(h / 24);
  return days === 1 ? 'igår' : `${days} dagar sedan`;
}

function renderHeader() {
  const t = todayKey();
  const label = current === t ? 'Idag' : current === shiftKey(t, -1) ? 'Igår' : longFmt.format(new Date(current + 'T12:00:00Z'));
  $('dayLabel').textContent = label;
  $('dayDate').textContent = current === t || current === shiftKey(t, -1) ? longFmt.format(new Date(current + 'T12:00:00Z')) : current;
  $('next').disabled = current >= t;
  $('today').hidden = current === t;
  $('summaryCard').hidden = current !== t;
}

function renderSummary(rows) {
  const box = $('summary');
  box.replaceChildren();
  const by = Object.fromEntries(rows.map((r) => [r.tag, r]));
  for (const [key, t] of Object.entries(TAGS)) {
    const r = by[key];
    const d = el('div', 'sum');
    d.append(el('span', 'ic', t.icon), el('b', '', t.label));
    d.append(el('span', '', r ? ago(new Date(r.created_at)) : '–'));
    if (r) d.append(el('span', '', r.author));
    box.append(d);
  }
}

function renderFeed(rows) {
  const feed = $('feed');
  feed.replaceChildren();
  const card = el('div', 'card');
  if (!rows.length) {
    card.append(el('div', 'empty', current === todayKey() ? 'Inget loggat idag än.' : 'Inget loggat den här dagen.'));
  }
  for (const r of rows) {
    const e = el('div', 'entry');
    const head = el('div', 'head');
    head.append(el('span', 'who', r.author), el('span', 'time', timeFmt.format(new Date(r.created_at))));
    e.append(head);
    if (r.tags.length) {
      const chips = el('div', 'chips');
      for (const k of r.tags) if (TAGS[k]) chips.append(el('span', 'chip', `${TAGS[k].icon} ${TAGS[k].label}`));
      e.append(chips);
    }
    if (r.note) e.append(el('div', 'note', r.note));
    const del = el('button', 'del', 'Ta bort');
    del.onclick = async () => {
      if (!confirm('Ta bort inlägget?')) return;
      try { await api(`/api/entries/${r.id}`, { method: 'DELETE' }); } catch (err) { alert(err.message); }
      load();
    };
    e.append(del);
    card.append(e);
  }
  feed.append(card);
}

async function load() {
  renderHeader();
  try {
    const wantSummary = current === todayKey();
    const [rows, last] = await Promise.all([api(`/api/day?date=${current}`), wantSummary ? api('/api/last') : Promise.resolve([])]);
    if (wantSummary) renderSummary(last);
    renderFeed(rows);
  } catch (err) {
    $('feed').replaceChildren(el('div', 'card empty', 'Kunde inte hämta loggen. Försök igen om en stund.'));
  }
}

// Formulär
function nowHHMM() {
  const p = new Intl.DateTimeFormat('sv-SE', { hour: '2-digit', minute: '2-digit', hourCycle: 'h23', timeZone: TZ }).formatToParts(new Date());
  const get = (t) => p.find((x) => x.type === t).value;
  return `${get('hour')}:${get('minute')}`;
}
function dayWord(key) {
  const t = todayKey();
  if (key === t) return 'idag';
  if (key === shiftKey(t, -1)) return 'igår';
  return longFmt.format(new Date(key + 'T12:00:00Z'));
}

function openSheet() {
  selected = new Set();
  $('time').value = current === todayKey() ? nowHHMM() : '12:00';
  $('whenDay').textContent = `(${dayWord(current)})`;
  document.querySelectorAll('.tog').forEach((b) => b.classList.remove('on'));
  $('note').value = '';
  $('err').textContent = '';
  $('name').value = getName();
  $('overlay').classList.add('open');
  if (!$('name').value) $('name').focus();
}
function closeSheet() { $('overlay').classList.remove('open'); }

document.querySelectorAll('.tog').forEach((b) => {
  b.onclick = () => {
    const k = b.dataset.tag;
    if (selected.has(k)) selected.delete(k); else selected.add(k);
    b.classList.toggle('on', selected.has(k));
  };
});

$('add').onclick = openSheet;
$('cancel').onclick = closeSheet;
$('overlay').onclick = (e) => { if (e.target === $('overlay')) closeSheet(); };

$('save').onclick = async () => {
  const author = $('name').value.trim();
  const note = $('note').value.trim();
  const time = $('time').value;
  if (!author) { $('err').textContent = 'Skriv ditt namn'; return; }
  if (!time) { $('err').textContent = 'Välj klockslag'; return; }
  if (!selected.size && !note) { $('err').textContent = 'Välj något eller skriv en kommentar'; return; }
  $('save').disabled = true;
  try {
    await api('/api/entries', { method: 'POST', body: JSON.stringify({ author, tags: [...selected], note, date: current, time }) });
    setName(author);
    closeSheet();
    load();
  } catch (err) {
    $('err').textContent = err.message;
  } finally {
    $('save').disabled = false;
  }
};

$('prev').onclick = () => { current = shiftKey(current, -1); load(); };
$('next').onclick = () => { if (current < todayKey()) { current = shiftKey(current, 1); load(); } };
$('today').onclick = () => { current = todayKey(); load(); };

(async function start() {
  try {
    const cfg = await api('/api/config');
    document.title = `${cfg.dogName}s logg`;
    $('title').textContent = `🐕 ${cfg.dogName}s logg`;
  } catch {}
  load();
  setInterval(() => { if (!document.hidden && !$('overlay').classList.contains('open')) load(); }, 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { if (current !== todayKey() && current > todayKey()) current = todayKey(); load(); } });
})();
</script>
</body>
</html>
